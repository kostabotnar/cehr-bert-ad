# CEHR-BERT Pretraining Configuration for Alzheimer's Disease Pipeline
#
# This config is used by: python -m cehrbert.runners.hf_cehrbert_pretrain_runner

# Model paths (will be created during pretraining)
model_name_or_path: "data/pretrain_results"
tokenizer_name_or_path: "data/pretrain_results"

# Data paths
data_folder: "data/cehrbert_data/patient_sequence"
dataset_prepared_path: "data/pretrain_prepared"

# Data processing
validation_split_percentage: 0.05
preprocessing_num_workers: 4
preprocessing_batch_size: 1000
streaming: false

# Tokenizer settings
vocab_size: 50000
min_frequency: 0

# Model architecture settings
att_function_type: "cehrbert"
is_data_in_meds: false
inpatient_att_function_type: "none"
include_auxiliary_token: true
include_demographic_prompt: false

# Training settings
do_train: true
seed: 42

# Model dimensions
num_hidden_layers: 6
max_position_embeddings: 4096
sample_packing_max_positions: 4096

# Output and checkpointing
output_dir: "data/pretrain_results"
evaluation_strategy: "epoch"
save_strategy: "epoch"

# Optimization
learning_rate: 0.00005
per_device_train_batch_size: 32
num_train_epochs: 10
warmup_steps: 1000
weight_decay: 0.01

# Logging
logging_steps: 100
save_total_limit: 3
report_to: "none"  # Disable wandb
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
